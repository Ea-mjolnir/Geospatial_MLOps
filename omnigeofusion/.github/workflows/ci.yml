# ================================================================
# OmniGeoFusion — CI Pipeline
# ================================================================
# Triggers on every push + pull request to main/develop
#
# Steps:
#   1. Lint:  ruff + black code style checks
#   2. Test:  unit tests for all modules
#   3. Build: Docker image build (no push on PR)
#   4. Scan:  Docker image security scan (Trivy)
#
# On push to main → triggers CD pipeline
# ================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'omnigeofusion/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'omnigeofusion/**'

defaults:
  run:
    working-directory: omnigeofusion

env:
  PYTHON_VERSION: "3.10"
  AWS_REGION:     "us-east-1"

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff black isort

      - name: Run ruff
        run: ruff check src/ tests/ --output-format=github

      - name: Run black
        run: black --check src/ tests/

      - name: Run isort
        run: isort --check-only src/ tests/


  # ── Job 2: Test ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GDAL system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgdal-dev gdal-bin \
            libgeos-dev libproj-dev \
            libspatialindex-dev

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.2.0 --index-url \
            https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short
        env:
          PYTHONPATH: .
          MPLBACKEND: agg

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: omnigeofusion/coverage.xml
          flags: omnigeofusion
        continue-on-error: true


  # ── Job 3: Build Docker ──────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: omnigeofusion
          file:    omnigeofusion/docker/Dockerfile.api
          push:    false
          tags:    omnigeofusion-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build fusion image
        uses: docker/build-push-action@v5
        with:
          context: omnigeofusion
          file:    omnigeofusion/docker/Dockerfile.fusion
          push:    false
          tags:    omnigeofusion-fusion:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


  # ── Job 4: Security scan ─────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image for scan
        uses: docker/build-push-action@v5
        with:
          context:    omnigeofusion
          file:       omnigeofusion/docker/Dockerfile.api
          push:       false
          load:       true
          tags:       omnigeofusion-api:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    omnigeofusion-api:scan
          format:       sarif
          output:       trivy-results.sarif
          severity:     CRITICAL,HIGH
          exit-code:    0   # don't fail on vulnerabilities (report only)

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true


  # ── Job 5: Validate Terraform ────────────────────────────────
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: omnigeofusion/infrastructure/terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: omnigeofusion/infrastructure/terraform

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: omnigeofusion/infrastructure/terraform
